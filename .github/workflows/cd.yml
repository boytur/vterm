name: CD - Build Prod (macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

permissions:
  contents: write

jobs:
  build-prod:
    name: Build Release (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          [[ -n "$cargo_version" && "$tag_version" == "$cargo_version" ]] || {
            echo "Tag v${tag_version} does not match Cargo.toml version ${cargo_version}." >&2
            exit 1
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-prod-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --verbose

      - name: Package .dmg
        run: |
          APP_NAME=vterm
          APP_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          BIN_PATH="target/release/$APP_NAME"
          APP_DIR="$APP_NAME.app"
          DEST="$APP_DIR/Contents/MacOS"
          mkdir -p "$DEST"
          cp "$BIN_PATH" "$DEST/$APP_NAME"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp assets/AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>vterm</string>
            <key>CFBundleDisplayName</key>
            <string>vterm</string>
            <key>CFBundleExecutable</key>
            <string>vterm</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.vterm.app</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP_DIR/Contents/Info.plist"
          # Build a distributable DMG with a drag-to-Applications shortcut
          STAGING="dmg_staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_DIR" "$STAGING/$APP_NAME.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGING" -ov -format UDZO "$APP_NAME-macos.dmg"

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk '
            /^## \[Unreleased\][[:space:]]*$/ { section = 1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vterm-macos
          path: vterm-macos.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vterm-macos.dmg
          body_path: release-notes.md
