name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    # The self-hosted Windows runner must never execute untrusted code:
    # PRs from forks skip that leg (hosted macOS coverage still applies).
    if: >-
      matrix.os != 'self-hosted-windows' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runs-on: '"macos-latest"'
          # Warm self-hosted box: incremental target dir, no queue/provision.
          # Register with: ./config.cmd --url https://github.com/boytur/vterm
          #   --token <fresh-token> --labels vterm-win
          - os: self-hosted-windows
            runs-on: '["self-hosted", "Windows", "X64", "vterm-win"]'
    # fromJSON: runs-on cannot expand an array-typed matrix value directly.
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
