name: Changelog Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Validate changelog entry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require an Unreleased entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" --depth=1

          if ! git diff --name-only "$BASE_SHA...HEAD" | grep -Fxq 'CHANGELOG.md'; then
            echo 'CHANGELOG.md must be updated in this pull request.' >&2
            exit 1
          fi

          if ! grep -Eq '^## \[Unreleased\][[:space:]]*$' CHANGELOG.md; then
            echo 'CHANGELOG.md must contain a ## [Unreleased] section.' >&2
            exit 1
          fi

          extract_unreleased() {
            awk '
              /^## \[Unreleased\][[:space:]]*$/ { section = 1; next }
              section && /^## / { exit }
              section { print }
            '
          }

          base_entry="$(git show "$BASE_SHA:CHANGELOG.md" 2>/dev/null | extract_unreleased || true)"
          head_entry="$(extract_unreleased < CHANGELOG.md)"

          if [[ "$HEAD_REF" == chore/release-v* ]]; then
            VERSION="${HEAD_REF#chore/release-v}"
            grep -Eq "^## \\[${VERSION//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
              echo "Release changelog PRs must add a dated heading for ${VERSION}." >&2
              exit 1
            }
            exit 0
          fi

          if [[ "$base_entry" == "$head_entry" ]]; then
            echo 'Add or update a bullet under ## [Unreleased].' >&2
            exit 1
          fi

          if ! printf '%s\n' "$head_entry" | grep -Eq '^[[:space:]]*-[[:space:]]+'; then
            echo 'The Unreleased section must contain at least one bullet.' >&2
            exit 1
          fi

      - name: Ensure every tagged release is documented
        run: |
          set -euo pipefail
          git tag --list 'v[0-9]*' --sort=version:refname | while read -r tag; do
            version="${tag#v}"
            if ! grep -Eq "^## \\[${version//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
              echo "Missing dated changelog heading for ${tag}." >&2
              exit 1
            fi

            if ! awk -v version="$version" '
              $0 ~ "^## \\[" version "\\] - " { section = 1; next }
              section && /^## / { exit }
              section && /^[[:space:]]*-[[:space:]]+/ { found = 1 }
              END { exit !(section && found) }
            ' CHANGELOG.md; then
              echo "Changelog section for ${tag} has no release bullet." >&2
              exit 1
            fi
          done
