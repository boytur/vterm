[package]
name = "vterm"
version = "0.2.0"
edition = "2024"

[dependencies]
async-channel = "2"
dirs = "6.0.0"
gpui = "0.2.2"
portable-pty = "0.8"
semver = "1.0.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "2.12.1", features = ["json", "tls"] }
vt100 = "0.16.2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parser_bench"
harness = false
